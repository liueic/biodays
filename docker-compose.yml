# biodays —— 双服务部署（Next.js + Go API 容器 + PostgreSQL）
#
# 镜像来自 CNB Docker 制品库（由 .cnb.yml 的 container 流水线推送）：
#   docker.cnb.cool/ciallo.cv/biodays:<tag>
#
# 用法：
#   cp .env.example .env   # 至少设置 BIODAYS_SITE_URL 与 BIODAYS_POSTGRES_PASSWORD
#   docker compose pull && docker compose up -d
#
# 配置透传：app 服务通过 env_file 读取 .env 的全部 BIODAYS_* 变量，
# 只有下方 environment 里列出的镜像固定值和拼装值不可被 .env 覆盖。
#
# 运行时设置（SMTP、频控、反滥用、订阅开关）保存在数据库里，通过
# /admin/settings 后台修改、保存即热生效；.env 中的同名变量仅作为
# 首次启动的初始值。密钥类设置需要 .env 提供 BIODAYS_SETTINGS_ENC_KEY。
#
# 注意：.env 中的 bcrypt 哈希等含 $ 的值经 env_file 原样传入，无需转义；
# 但下面 environment 里出现的 ${...} 仍会被 Compose 插值。
#
# 镜像私有化时需先登录（访问令牌见 CNB「个人设置 / 访问令牌」）：
#   docker login docker.cnb.cool -u cnb -p <访问令牌>
# 公开制品库无需登录，直接 pull。

name: biodays

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biodays
      # 用 hex 随机串（openssl rand -hex 24），避免 URL 特殊字符转义问题。
      POSTGRES_PASSWORD: ${BIODAYS_POSTGRES_PASSWORD:?请在 .env 设置 BIODAYS_POSTGRES_PASSWORD}
      POSTGRES_DB: biodays
    volumes:
      - biodays-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biodays -d biodays"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${BIODAYS_IMAGE:-docker.cnb.cool/ciallo.cv/biodays:latest}
    pull_policy: ${BIODAYS_PULL_POLICY:-missing}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    restart: unless-stopped
    # Go 侧优雅退出最多等 10s，launcher 再等子进程；给足停止时间，避免 worker 被强杀。
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIODAYS_BIND_IP:-127.0.0.1}:${BIODAYS_HTTP_PORT:-8080}:3000"
    env_file:
      # .env 里的 BIODAYS_* 调节项全部直达容器；environment 优先级更高。
      - path: .env
        required: false
    environment:
      # 镜像内固定路径；PostgreSQL 模式下两个 SQLite 路径被忽略。
      BIODAYS_DB_PATH: /data/biodays.db
      BIODAYS_FEEDBACK_DB_PATH: /var/lib/biodays/feedback.db
      # 镜像内置 JSON 语料：启动时增量导入（新语料随镜像下发，管理员编辑/删除不会被覆盖）。
      # 指纹一致时零导入。
      BIODAYS_DATA_DIR: /stories-data
      # 故事与反馈同库。要临时回退单容器 SQLite 模式：注释本行与 db 服务/depends_on。
      BIODAYS_DB_DSN: postgres://biodays:${BIODAYS_POSTGRES_PASSWORD}@db:5432/biodays
      # 浏览器实际访问的 origin；确认/退订链接和管理端 Origin 校验都依赖它。
      BIODAYS_SITE_URL: ${BIODAYS_SITE_URL:-http://localhost:8080}
      # 同源代理内无需 CORS 覆盖；需要时在 .env 设置 BIODAYS_CORS_ORIGINS。
      BIODAYS_CORS_ORIGINS: ${BIODAYS_CORS_ORIGINS:-*}
    volumes:
      # PostgreSQL 模式下不再使用；保留供回退 SQLite 模式时挂载反馈库。
      - biodays-feedback:/var/lib/biodays
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  biodays-pg:
  biodays-feedback:
