name: Migration regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify Node.js runtime
        run: node web/scripts/check-node.mjs
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.95.4
      # setup-cli installs its own Bun runtime; restore the application's version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Install and validate content
        working-directory: web
        run: bun install --frozen-lockfile && bun run prepare:assets
      - name: Types and lint
        working-directory: web
        run: bunx --no-install next typegen && bun run typecheck && bun run lint
      - name: Database transactions and concurrency
        run: python3 scripts/test-database.py
      - name: Start isolated Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit > /tmp/supabase.log 2>&1
      - name: Export local test environment
        run: python3 scripts/local-test-env.py --github
      - name: Create local identity fixture and test business rules
        working-directory: web
        run: bun run test:admin:create && bun run test
      - name: Production build without database credentials
        working-directory: web
        run: env -u SUPABASE_URL -u SUPABASE_SECRET_KEY -u SUPABASE_PUBLISHABLE_KEY bun run build
      - name: Reading survives database failure
        run: python3 scripts/test-content-isolation.py
      - name: Browser tests
        working-directory: web
        run: bunx playwright install --with-deps chromium && bun run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-traces
          path: web/test-results
          retention-days: 3
      - name: Stop local services
        if: always()
        run: supabase stop
