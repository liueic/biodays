basePath: /
definitions:
  biodays_server_internal_model.ChallengeDTO:
    properties:
      challenge_id:
        type: string
      difficulty:
        type: integer
      expires_at:
        type: string
      issued_at:
        type: string
      min_submit_seconds:
        type: integer
      salt:
        type: string
    type: object
  biodays_server_internal_model.FeedbackDetailDTO:
    properties:
      closed_at:
        type: string
      confirmed_at:
        type: string
      consent_version:
        type: string
      consented_at:
        type: string
      content:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      events:
        items:
          $ref: '#/definitions/biodays_server_internal_model.FeedbackEventDTO'
        type: array
      id:
        type: string
      internal_note:
        type: string
      kind:
        type: string
      mail:
        items:
          $ref: '#/definitions/biodays_server_internal_model.MailTaskDTO'
        type: array
      nickname:
        type: string
      public_reply:
        type: string
      source_url:
        type: string
      spam_confidence:
        type: number
      spam_model:
        type: string
      spam_score:
        type: integer
      spam_signals:
        items:
          type: string
        type: array
      spam_source:
        type: string
      spam_verdict:
        type: string
      status:
        type: string
      story_id:
        type: string
      subscription_status:
        type: string
      title:
        type: string
      unsubscribed_at:
        type: string
      updated_at:
        type: string
      verification_method:
        type: string
      verified_at:
        type: string
      version:
        type: integer
    type: object
  biodays_server_internal_model.FeedbackEventDTO:
    properties:
      actor:
        type: string
      created_at:
        type: string
      from_status:
        type: string
      internal_note:
        type: string
      public_reply:
        type: string
      seq:
        type: integer
      to_status:
        type: string
    type: object
  biodays_server_internal_model.FeedbackKindOption:
    properties:
      label:
        example: 想看话题
        type: string
      value:
        example: topic
        type: string
    type: object
  biodays_server_internal_model.FeedbackLimits:
    properties:
      content_max:
        example: 5000
        type: integer
      content_min:
        example: 10
        type: integer
      nickname_max:
        example: 40
        type: integer
      source_url_max:
        example: 2048
        type: integer
      title_max:
        example: 80
        type: integer
      title_min:
        example: 1
        type: integer
    type: object
  biodays_server_internal_model.FeedbackListItemDTO:
    properties:
      created_at:
        type: string
      has_email:
        type: boolean
      has_nickname:
        type: boolean
      id:
        type: string
      kind:
        type: string
      spam_score:
        type: integer
      spam_verdict:
        type: string
      status:
        type: string
      story_id:
        type: string
      subscription_status:
        type: string
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  biodays_server_internal_model.FeedbackOptionsDTO:
    properties:
      enabled:
        type: boolean
      kinds:
        items:
          $ref: '#/definitions/biodays_server_internal_model.FeedbackKindOption'
        type: array
      limits:
        $ref: '#/definitions/biodays_server_internal_model.FeedbackLimits'
      subscriptions_enabled:
        type: boolean
      verification:
        $ref: '#/definitions/biodays_server_internal_model.VerificationOptionsDTO'
    type: object
  biodays_server_internal_model.MailStatusDTO:
    properties:
      configured:
        type: boolean
      counts:
        additionalProperties:
          format: int64
          type: integer
        type: object
      missing:
        items:
          type: string
        type: array
      notify_configured:
        type: boolean
      recent_errors:
        items:
          $ref: '#/definitions/biodays_server_internal_model.MailTaskDTO'
        type: array
      smtp_enabled:
        type: boolean
    type: object
  biodays_server_internal_model.MailTaskDTO:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      next_attempt_at:
        type: string
      smtp_accepted_at:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  biodays_server_internal_model.Meta:
    properties:
      coverage:
        example: 1-3月 / 10-12月
        type: string
      dataset_version:
        type: string
      month_counts:
        additionalProperties:
          format: int64
          type: integer
        type: object
      quarters:
        example:
        - Q1
        - Q4
        items:
          type: string
        type: array
      total:
        example: 104
        type: integer
    type: object
  biodays_server_internal_model.Source:
    properties:
      citation:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  biodays_server_internal_model.StoryDTO:
    properties:
      content:
        type: string
      day:
        example: 5
        type: integer
      geek_quote:
        type: string
      id:
        example: Q1-01
        type: string
      lab_item:
        type: string
      month:
        example: 1
        type: integer
      source:
        $ref: '#/definitions/biodays_server_internal_model.Source'
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      year:
        example: 1961
        type: integer
    type: object
  biodays_server_internal_model.StorySummaryDTO:
    properties:
      day:
        type: integer
      id:
        type: string
      lab_item:
        type: string
      month:
        type: integer
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      year:
        type: integer
    type: object
  biodays_server_internal_model.SubmitReceiptDTO:
    properties:
      confirmation_email:
        example: queued
        type: string
      created_at:
        type: string
      id:
        example: 9f2c1d7e8a4b
        type: string
      status:
        example: pending
        type: string
      subscription_status:
        example: none
        type: string
    type: object
  biodays_server_internal_model.TagCount:
    properties:
      count:
        example: 8
        type: integer
      name:
        example: 仪器极客
        type: string
    type: object
  biodays_server_internal_model.VerificationOptionsDTO:
    properties:
      ai_assisted:
        type: boolean
      pow_difficulty:
        type: integer
      pow_enabled:
        type: boolean
      pow_min_seconds:
        type: integer
      turnstile_enabled:
        type: boolean
      turnstile_site_key:
        type: string
    type: object
  biodays_server_internal_service.StoryBatchResult:
    properties:
      accepted:
        type: integer
      items:
        items:
          $ref: '#/definitions/biodays_server_internal_service.StoryUpsertItem'
        type: array
      rejected:
        type: integer
    type: object
  biodays_server_internal_service.StoryUpsertItem:
    properties:
      created:
        type: boolean
      id:
        example: Q1-01
        type: string
      problems:
        items:
          type: string
        type: array
    type: object
  internal_handler.AcceptedDTO:
    properties:
      accepted:
        example: true
        type: boolean
    type: object
  internal_handler.AcceptedResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.AcceptedDTO'
    type: object
  internal_handler.AdminFeedbackDetailResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.FeedbackDetailDTO'
    type: object
  internal_handler.AdminFeedbackListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/biodays_server_internal_model.FeedbackListItemDTO'
        type: array
      meta:
        $ref: '#/definitions/internal_handler.ListMeta'
    type: object
  internal_handler.AdminPatchRequest:
    properties:
      internal_note:
        type: string
      notify_subscriber:
        type: boolean
      public_reply:
        type: string
      status:
        type: string
      version:
        type: integer
    type: object
  internal_handler.AdminSessionDTO:
    properties:
      csrf_token:
        type: string
      expires_at:
        type: string
      username:
        type: string
    type: object
  internal_handler.AdminSessionResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.AdminSessionDTO'
    type: object
  internal_handler.AdminStoryBatchResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_service.StoryBatchResult'
    type: object
  internal_handler.AdminStoryResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.StoryDTO'
    type: object
  internal_handler.AdminStoryUpsertResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_service.StoryUpsertItem'
    type: object
  internal_handler.AdminUpdateMeta:
    properties:
      notified:
        type: boolean
      notify_skipped_note:
        type: string
    type: object
  internal_handler.AdminUpdateResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.FeedbackDetailDTO'
      meta:
        $ref: '#/definitions/internal_handler.AdminUpdateMeta'
    type: object
  internal_handler.ChallengeResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.ChallengeDTO'
    type: object
  internal_handler.ErrorBody:
    properties:
      code:
        example: STORY_NOT_FOUND
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        example: story Q2-99 not found
        type: string
    type: object
  internal_handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_handler.ErrorBody'
    type: object
  internal_handler.FeedbackOptionsResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.FeedbackOptionsDTO'
    type: object
  internal_handler.FeedbackReceiptResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.SubmitReceiptDTO'
    type: object
  internal_handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  internal_handler.HistoryRequest:
    properties:
      id:
        maxLength: 16
        type: string
    required:
    - id
    type: object
  internal_handler.ListMeta:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 104
        type: integer
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        example: correct horse battery staple
        type: string
      username:
        example: admin
        type: string
    type: object
  internal_handler.MailStatusResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.MailStatusDTO'
    type: object
  internal_handler.MailTaskListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/biodays_server_internal_model.MailTaskDTO'
        type: array
      meta:
        $ref: '#/definitions/internal_handler.ListMeta'
    type: object
  internal_handler.MetaResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.Meta'
    type: object
  internal_handler.StoryListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/biodays_server_internal_model.StoryDTO'
        type: array
      meta:
        $ref: '#/definitions/internal_handler.ListMeta'
    type: object
  internal_handler.StorySummaryListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/biodays_server_internal_model.StorySummaryDTO'
        type: array
      meta:
        $ref: '#/definitions/internal_handler.ListMeta'
    type: object
  internal_handler.SubscriptionResultDTO:
    properties:
      result:
        example: confirmed
        type: string
      subscription_status:
        example: confirmed
        type: string
    type: object
  internal_handler.SubscriptionResultResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.SubscriptionResultDTO'
    type: object
  internal_handler.TagsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/biodays_server_internal_model.TagCount'
        type: array
    type: object
  internal_handler.TodayMeta:
    properties:
      is_fallback:
        example: false
        type: boolean
    type: object
  internal_handler.TodayResponse:
    properties:
      data:
        $ref: '#/definitions/biodays_server_internal_model.StoryDTO'
      meta:
        $ref: '#/definitions/internal_handler.TodayMeta'
    type: object
  internal_handler.resendRequest:
    properties:
      email:
        type: string
      feedback_id:
        type: string
    type: object
  internal_handler.submitRequest:
    properties:
      challenge_id:
        type: string
      challenge_nonce:
        type: string
      content:
        type: string
      email:
        type: string
      kind:
        type: string
      nickname:
        type: string
      request_id:
        type: string
      source_url:
        type: string
      story_id:
        type: string
      subscribe_updates:
        type: boolean
      title:
        type: string
      turnstile_token:
        type: string
      website:
        description: 'honeypot: must stay empty'
        type: string
    type: object
  internal_handler.tokenRequest:
    properties:
      token:
        type: string
    type: object
info:
  contact: {}
  description: 实验室科学史上的今天 · 公开 REST API 与反馈/管理接口
  title: biodays API
  version: "1.0"
paths:
  /api/v1/admin/feedback:
    get:
      description: 按新到旧排序，支持 kind/status/q 筛选与分页；列表不返回完整邮箱。
      parameters:
      - description: 反馈类型
        in: query
        name: kind
        type: string
      - description: 反馈状态
        in: query
        name: status
        type: string
      - description: 关键词
        in: query
        name: q
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminFeedbackListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 反馈收件箱列表
      tags:
      - admin
  /api/v1/admin/feedback/{id}:
    delete:
      description: 清理联系方式、订阅令牌、事件与未发送邮件，保留最小删除审计信息。
      parameters:
      - description: 反馈编号
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AcceptedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 删除反馈
      tags:
      - admin
    get:
      description: 返回完整投稿、联系方式、处理记录和邮件任务状态。
      parameters:
      - description: 反馈编号
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminFeedbackDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 反馈详情
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: 携带 version 做并发控制；状态变化时记录事件。只有已确认订阅且显式 notify_subscriber 时才排队用户邮件。
      parameters:
      - description: 反馈编号
        in: path
        name: id
        required: true
        type: string
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AdminPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminUpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 更新反馈状态与备注
      tags:
      - admin
  /api/v1/admin/login:
    post:
      consumes:
      - application/json
      description: 同源 JSON 请求；成功设置 HttpOnly + SameSite=Strict 会话 Cookie，返回 CSRF 令牌。失败尝试按
        IP/账号独立限流。
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 管理员登录
      tags:
      - admin
  /api/v1/admin/logout:
    post:
      description: 立即撤销当前会话并清除 Cookie。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AcceptedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 管理员退出
      tags:
      - admin
  /api/v1/admin/mail/outbox:
    get:
      description: 分页查看任务类型、状态、尝试次数与失败原因；不返回收件人与敏感 payload。
      parameters:
      - description: 任务类型
        in: query
        name: type
        type: string
      - description: 任务状态
        in: query
        name: status
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MailTaskListResponse'
      summary: 邮件任务列表
      tags:
      - admin
  /api/v1/admin/mail/outbox/{id}/retry:
    post:
      description: 仅 failed/unknown 任务可重试；发送前由 worker 复查订阅与反馈状态。
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handler.AcceptedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 重试邮件任务
      tags:
      - admin
  /api/v1/admin/mail/status:
    get:
      description: 返回配置是否齐全、队列计数和最近错误；不返回任何口令。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MailStatusResponse'
      summary: SMTP 配置与队列状态
      tags:
      - admin
  /api/v1/admin/mail/test:
    post:
      description: 仅发往配置的管理员接收地址，返回 202；调用方不能指定收件人。
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handler.AcceptedResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 发送 SMTP 测试邮件
      tags:
      - admin
  /api/v1/admin/me:
    get:
      description: 返回管理员用户名、CSRF 令牌与过期时间；令牌不进入 localStorage。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 当前管理员会话
      tags:
      - admin
  /api/v1/admin/stories:
    get:
      description: 与公开列表相同的过滤参数，默认 summary 视图；需要管理员会话或 API Token。
      parameters:
      - description: 月份 1-12
        in: query
        name: month
        type: integer
      - description: 日期 1-31（需配合 month）
        in: query
        name: day
        type: integer
      - description: 标签名
        in: query
        name: tag
        type: string
      - description: 标题/摘要/条目关键词
        in: query
        name: q
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: summary（默认）或 full
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.StorySummaryListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 管理端故事列表
      tags:
      - admin-stories
    post:
      consumes:
      - application/json
      description: 请求体为单篇故事对象，或 {"stories":[...]} 批量（≤200 篇）。按 id 幂等 upsert；批量逐条报告，单篇校验失败返回
        400。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminStoryBatchResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.AdminStoryUpsertResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 发布/更新故事
      tags:
      - admin-stories
  /api/v1/admin/stories/{id}:
    delete:
      description: 按 id 删除故事并清理孤立标签。
      parameters:
      - description: 故事 id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 删除故事
      tags:
      - admin-stories
    get:
      description: 返回单条故事的完整字段。
      parameters:
      - description: 故事 id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminStoryResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 管理端故事详情
      tags:
      - admin-stories
    patch:
      consumes:
      - application/json
      description: 按 id 打补丁；出现的字段覆盖原值，缺席字段保持不变，id 不可改。
      parameters:
      - description: 故事 id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AdminStoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 部分更新故事
      tags:
      - admin-stories
  /api/v1/feedback:
    post:
      consumes:
      - application/json
      description: 无需注册。首次写入返回 201；相同 request_id 与相同内容的重试返回 200 与原回执；相同 request_id
        不同内容返回 409。
      parameters:
      - description: 反馈内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.submitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FeedbackReceiptResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.FeedbackReceiptResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 匿名提交反馈
      tags:
      - feedback
  /api/v1/feedback/challenge:
    post:
      description: 返回一次性、绑定客户端 IP 的 SHA-256 工作量证明挑战。挑战在服务端存储，提交后单次消费。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ChallengeResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 签发 PoW 挑战
      tags:
      - feedback
  /api/v1/feedback/options:
    get:
      description: 返回反馈是否启用、是否支持邮件订阅、反馈类型和字段限制；不含任何 SMTP 凭据。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FeedbackOptionsResponse'
      summary: 反馈表单能力
      tags:
      - feedback
  /api/v1/feedback/subscriptions/confirm:
    post:
      consumes:
      - application/json
      description: GET 不修改状态；本接口由页面按钮 POST 调用，单次使用，重复确认返回稳定结果。
      parameters:
      - description: 确认令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SubscriptionResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 确认邮件订阅
      tags:
      - feedback
  /api/v1/feedback/subscriptions/resend:
    post:
      consumes:
      - application/json
      description: 始终返回 202，不泄露邮箱与反馈的对应关系；实际发送需匹配且通过频率限制。
      parameters:
      - description: 反馈编号与邮箱
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.resendRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_handler.AcceptedResponse'
      summary: 重发订阅确认邮件
      tags:
      - feedback
  /api/v1/feedback/subscriptions/unsubscribe:
    post:
      consumes:
      - application/json
      description: 使用专用令牌，幂等；已退订时返回稳定结果。
      parameters:
      - description: 退订令牌
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SubscriptionResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 退订反馈邮件
      tags:
      - feedback
  /api/v1/history:
    post:
      consumes:
      - application/json
      description: 将已读 ID 保存到当前浏览器的 HttpOnly Cookie，90 天过期；不会写入 SQLite。
      parameters:
      - description: 已展示给用户的故事
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.HistoryRequest'
      responses:
        "204":
          description: 已记录
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 记录已浏览故事
      tags:
      - stories
  /api/v1/meta:
    get:
      description: 返回故事总数、覆盖季度与月份范围。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.MetaResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 数据集概况
      tags:
      - meta
  /api/v1/stories:
    get:
      description: 支持按月/日、标签、关键词筛选，固定按 month, day, year 排序。
      parameters:
      - description: 月份 1-12
        in: query
        name: month
        type: integer
      - description: 日期 1-31，需与 month 同时使用
        in: query
        name: day
        type: integer
      - description: 标签精确匹配
        in: query
        name: tag
        type: string
      - description: 关键词，匹配 title/summary/lab_item
        in: query
        name: q
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: summary 不含正文和来源，适合列表；默认 full 保持兼容
        enum:
        - full
        - summary
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.StoryListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 故事列表
      tags:
      - stories
  /api/v1/stories/{id}:
    get:
      description: 按业务 id 返回单条故事。
      parameters:
      - description: 故事 id，例如 Q1-01
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/biodays_server_internal_model.StoryDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 故事详情
      tags:
      - stories
  /api/v1/stories/random:
    get:
      description: 随机返回一条故事，可通过 exclude 排除当前正在展示的 id。
      parameters:
      - description: 逗号分隔的 id 列表，最多 100 个
        in: query
        name: exclude
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/biodays_server_internal_model.StoryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 随机故事
      tags:
      - stories
  /api/v1/tags:
    get:
      description: 返回全部标签及对应故事数量，按数量倒序。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TagsResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 标签列表
      tags:
      - meta
  /api/v1/today:
    get:
      description: 从指定时区今天对应的全部故事中优先随机选未读篇目，不限制 ID 编码格式；当日无数据时按 fallback 策略返回随机一篇并标记
        is_fallback。
      parameters:
      - default: "+08:00"
        description: 时区偏移，例如 +08:00
        in: query
        name: tz
        type: string
      - default: random
        description: random 或 none
        enum:
        - random
        - none
        in: query
        name: fallback
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.TodayResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: 获取今日故事
      tags:
      - stories
  /healthz:
    get:
      description: 返回服务存活状态，不参与限流。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.HealthResponse'
      summary: 健康检查
      tags:
      - system
  /readyz:
    get:
      description: 检查数据库连通性；失败时返回 503，且不参与限流。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handler.HealthResponse'
      summary: 就绪检查
      tags:
      - system
schemes:
- http
- https
swagger: "2.0"
