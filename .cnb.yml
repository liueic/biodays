# biodays CI —— 由 GitHub Actions（.github/workflows/container.yml）迁移而来
#
# push main / 打 v*.*.* tag 时，go、web 两条流水线并行执行，全部通过后 container
# 构建 linux/amd64,linux/arm64 双架构镜像并推送到 CNB Docker 制品库。
# PR 场景只做同样的校验与镜像构建，不推送。
#
# 工具链版本与 .prototools 对齐：Go 1.27.3、Bun 1.4.4。
# cgo（go-sqlite3）需要 gcc，golang:*-alpine 不自带 build-base，Dockerfile 里必须 apk add build-base。
# container 流水线依赖 services: docker 提供 docker CLI/daemon，缺失会直接 command not found。
#
# 镜像地址 ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
#   push main  -> latest / main / sha-<短哈希>
#   tag v1.2.3 -> 1.2.3 / 1.2 / latest
#   PR         -> 只构建，不推送

"**":
  pull_request:
    - name: go
      label:
        type: CI
      lock:
        key: ci-go
        cancel-in-progress: true
        wait: true
      docker:
        image: golang:1.27.3
        volumes:
          # runner 可能是 amd64 也可能是 arm64，go-build 缓存与架构强相关，
          # 混挂会让缓存反复 miss（甚至读到机器码不匹配的条目）。按 GOARCH 分开。
          - /tmp/gomod
          - /tmp/gocache/$GOARCH
      env:
        CGO_ENABLED: "1"
        GOMODCACHE: /tmp/gomod
        # 与上面的 volume 必须保持一致，否则缓存写了不用
        GOCACHE: /tmp/gocache/$GOARCH
      stages:
        - name: vet
          script: cd server && go vet ./...
        - name: test
          script: cd server && go test -race -count=1 ./...
        - name: govulncheck
          # 固定版本而不是 @latest：@latest 不带版本号，Go 不会复用 GOMODCACHE，
          # 每次都重新下载 x/vuln 和它的 x/tools 依赖再冷编译。
          # 版本要跟 Go 1.27 的语法对齐，太旧（v1.1.4）会 panic: unexpected expr。
          script: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

    - name: web
      label:
        type: CI
      lock:
        key: ci-web
        cancel-in-progress: true
        wait: true
      docker:
        image: oven/bun:1.4.4
        volumes:
          - /root/.bun/install/cache
      stages:
        - name: install
          script: cd web && bun install --frozen-lockfile
        - name: typecheck
          script: cd web && bun run typecheck
        - name: lint
          script: cd web && bun run lint

    - name: container
      label:
        type: CI
      lock:
        key: ci-container
        cancel-in-progress: true
        wait: true
      services:
        - docker
      env:
        IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE
        # 构建缓存单独占一个 tag，跟产物 tag 分开，不会被当成可部署镜像
        CACHE_IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE:buildcache
      stages:
        - name: build
          script: |
            # PR 只校验能构建成功，产物不落盘。
            # Layer 缓存走 registry：缓存未变化的分支后续复用，不必从零编译。
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=$CACHE_IMAGE \
              --cache-to type=registry,ref=$CACHE_IMAGE,mode=max \
              --output type=cacheonly \
              --provenance=false --sbom=false \
              .

main:
  push:
    - name: go
      label:
        type: CI
      lock:
        key: ci-go
        cancel-in-progress: true
        wait: true
      docker:
        image: golang:1.27.3
        volumes:
          # runner 可能是 amd64 也可能是 arm64，go-build 缓存与架构强相关，
          # 混挂会让缓存反复 miss（甚至读到机器码不匹配的条目）。按 GOARCH 分开。
          - /tmp/gomod
          - /tmp/gocache/$GOARCH
      env:
        CGO_ENABLED: "1"
        GOMODCACHE: /tmp/gomod
        # 与上面的 volume 必须保持一致，否则缓存写了不用
        GOCACHE: /tmp/gocache/$GOARCH
      stages:
        - name: vet
          script: cd server && go vet ./...
        - name: test
          script: cd server && go test -race -count=1 ./...
        - name: govulncheck
          # 固定版本而不是 @latest：@latest 不带版本号，Go 不会复用 GOMODCACHE，
          # 每次都重新下载 x/vuln 和它的 x/tools 依赖再冷编译。
          # 版本要跟 Go 1.27 的语法对齐，太旧（v1.1.4）会 panic: unexpected expr。
          script: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

    - name: web
      label:
        type: CI
      lock:
        key: ci-web
        cancel-in-progress: true
        wait: true
      docker:
        image: oven/bun:1.4.4
        volumes:
          - /root/.bun/install/cache
      stages:
        - name: install
          script: cd web && bun install --frozen-lockfile
        - name: typecheck
          script: cd web && bun run typecheck
        - name: lint
          script: cd web && bun run lint

    - name: container
      label:
        type: CI
      lock:
        key: ci-container
        cancel-in-progress: true
        wait: true
      # 必须声明 docker 服务，否则环境内没有 docker CLI/daemon（cnb: command not found）
      services:
        - docker
      env:
        IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE
        CACHE_IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE:buildcache
      stages:
        - name: build and push
          script: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=$CACHE_IMAGE \
              --cache-to type=registry,ref=$CACHE_IMAGE,mode=max \
              -t $IMAGE:latest \
              -t $IMAGE:main \
              -t $IMAGE:sha-$CNB_COMMIT_SHORT \
              --provenance=false --sbom=false \
              --push \
              .

"v*.*.*":
  tag_push:
    - name: go
      label:
        type: RELEASE
      docker:
        image: golang:1.27.3
        volumes:
          # runner 可能是 amd64 也可能是 arm64，go-build 缓存与架构强相关，
          # 混挂会让缓存反复 miss（甚至读到机器码不匹配的条目）。按 GOARCH 分开。
          - /tmp/gomod
          - /tmp/gocache/$GOARCH
      env:
        CGO_ENABLED: "1"
        GOMODCACHE: /tmp/gomod
        # 与上面的 volume 必须保持一致，否则缓存写了不用
        GOCACHE: /tmp/gocache/$GOARCH
      stages:
        - name: vet
          script: cd server && go vet ./...
        - name: test
          script: cd server && go test -race -count=1 ./...
        - name: govulncheck
          # 固定版本而不是 @latest：@latest 不带版本号，Go 不会复用 GOMODCACHE，
          # 每次都重新下载 x/vuln 和它的 x/tools 依赖再冷编译。
          # 版本要跟 Go 1.27 的语法对齐，太旧（v1.1.4）会 panic: unexpected expr。
          script: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

    - name: web
      label:
        type: RELEASE
      docker:
        image: oven/bun:1.4.4
        volumes:
          - /root/.bun/install/cache
      stages:
        - name: install
          script: cd web && bun install --frozen-lockfile
        - name: typecheck
          script: cd web && bun run typecheck
        - name: lint
          script: cd web && bun run lint

    - name: container
      label:
        type: RELEASE
      services:
        - docker
      env:
        IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE
        CACHE_IMAGE: $CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE:buildcache
      stages:
        - name: build and push
          script: |
            # v1.2.3 -> 1.2.3 与 1.2
            VERSION=${CNB_BRANCH#v}
            MINOR=${VERSION%.*}
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from type=registry,ref=$CACHE_IMAGE \
              --cache-to type=registry,ref=$CACHE_IMAGE,mode=max \
              -t $IMAGE:$VERSION \
              -t $IMAGE:$MINOR \
              -t $IMAGE:latest \
              --provenance=false --sbom=false \
              --push \
              .

